# Pinned to targetSdk (35), not compileSdk (37) — Robolectric emulates targetSdkVersion, never
# compileSdk. See the app-test-framework ADR.
sdk=35
# TopTrumpsApplication.onCreate() builds a full AppGraph (NSD discovery, Room DB, sound setup) —
# override to a bare Application so every :app unit test stays isolated from real app startup.
# A test that switches to createAndroidComposeRule<MainActivity>() will hit a ClassCastException
# at `application as TopTrumpsApplication` because of this override; that's expected, not a bug.
application=android.app.Application
