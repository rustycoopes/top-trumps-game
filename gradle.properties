org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# KSP (an external plugin) still adds generated sources via the classic `kotlin.sourceSets` DSL,
# which AGP 9's built-in-Kotlin support (see toptrumps.android-library's doc comment) now forbids
# by default. :feature:history is this repo's first KSP consumer (Room) — see the module-structure
# ADR and slice-8's WBS.
android.disallowKotlinSourceSets=false
