[versions]
compileSdk = "37"
targetSdk = "35"
minSdk = "26"
agp = "9.1.1"
kotlin = "2.2.0"
coroutines = "1.9.0"
serializationJson = "1.7.3"
datetime = "0.6.1"
androidxAnnotation = "1.9.1"
